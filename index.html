<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>Plan Pracy</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --border: #334155;
      --accent: #38bdf8; --accent2: #818cf8; --text: #f1f5f9;
      --muted: #94a3b8; --off: #475569; --today-bg: #1e3a5f;
      --today-acc: #38bdf8; --green: #34d399; --red: #ef4444;
      --yellow: #fbbf24; --week-bg: #162032;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

    /* ── EKRAN WYBORU ── */
    #screenSelect {
      display: flex; flex-direction: column;
      min-height: 100vh; padding: 40px 24px 24px;
    }
    .select-title {
      font-family: 'Space Mono', monospace;
      font-size: 11px; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 8px;
    }
    .select-heading {
      font-size: 26px; font-weight: 300;
      color: var(--text); margin-bottom: 32px;
    }
    .scena-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent2); margin: 20px 0 8px;
    }
    .worker-btn {
      display: block; width: 100%;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 18px;
      color: var(--text); font-size: 16px; font-family: 'DM Sans', sans-serif;
      text-align: left; cursor: pointer; margin-bottom: 8px;
      transition: border-color 0.2s, background 0.2s;
    }
    .worker-btn:active { border-color: var(--accent); background: var(--today-bg); }

    /* ── EKRAN PLANU ── */
    #screenPlan { display: none; flex-direction: column; min-height: 100vh; }

    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--bg); border-bottom: 1px solid var(--border);
      padding: 16px 20px 12px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .app-title { font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); cursor: pointer; }
    .employee-name { font-size: 22px; font-weight: 300; color: var(--text); margin-top: 2px; }
    .toggle-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); padding: 8px 12px; cursor: pointer;
      font-size: 13px; font-family: 'Space Mono', monospace;
      display: flex; align-items: center; gap: 6px;
    }
    .toggle-btn:active { border-color: var(--accent); color: var(--accent); }
    .ico-refresh { display: inline-block; }
    .spinning .ico-refresh { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .last-update { font-size: 11px; color: var(--off); margin-top: 8px; font-family: 'Space Mono', monospace; }

    main { padding-bottom: 40px; }

    .week-label {
      padding: 10px 20px 6px;
      font-family: 'Space Mono', monospace; font-size: 10px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--accent2); background: var(--week-bg);
      border-bottom: 1px solid var(--border);
    }
    .shift-row {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 8px 20px; animation: fadeIn 0.3s ease both;
    }
    .shift-row.today { background: var(--today-bg); border-left: 3px solid var(--today-acc); }
    .shift-row.off { opacity: 0.5; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

    .row-top { display: flex; align-items: baseline; }
    .col-date { font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; color: #e2e8f0; width: 82px; flex-shrink: 0; }
    .shift-row.today .col-date { color: #7dd3fc; }
    .col-day { flex: 1; font-size: 14px; color: #cbd5e1; }
    .shift-row.today .col-day { color: var(--text); font-weight: 500; }
    .col-hours { font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; color: var(--green); white-space: nowrap; }
    .col-hours.off-text { color: var(--off); font-weight: 400; font-size: 12px; }
    .today-badge { font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--today-acc); background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3); border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: middle; }

    .row-sub { display: flex; align-items: flex-start; margin-top: 4px; gap: 8px; }
    .col-spektakl { flex: 1; padding-left: 82px; font-size: 11px; color: var(--red); font-weight: 500; line-height: 1.45; }
    .col-proby { font-size: 11px; color: var(--yellow); line-height: 1.45; white-space: pre-line; text-align: right; flex-shrink: 0; max-width: 130px; }

    .status { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 14px; }
    .status.error { color: #f87171; }
    .loader { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  </style>
</head>
<body>

<!-- EKRAN WYBORU PRACOWNIKA -->
<div id="screenSelect">
  <div class="select-title">Plan Pracy</div>
  <div class="select-heading">Wybierz pracownika</div>
  <div id="workerList">
    <div class="status"><div class="loader"></div>Ładowanie listy...</div>
  </div>
</div>

<!-- EKRAN PLANU -->
<div id="screenPlan">
  <header>
    <div class="header-top">
      <div>
        <div class="app-title" onclick="goBack()" title="Zmień pracownika">← PLAN PRACY</div>
        <div class="employee-name" id="empName"></div>
      </div>
      <button class="toggle-btn" id="toggleBtn" onclick="toggleMode()">
        <span class="ico-refresh">⟳</span>
        <span id="modeLabel">PLAN</span>
      </button>
    </div>
    <div class="last-update" id="lastUpdate"></div>
  </header>
  <main id="content"></main>
</div>

<script>
  const GIST_ID   = "83ed1babbdf45543eabbb6026ead2ec9";
  const BASE_URL  = `https://gist.githubusercontent.com/zbylcio/${GIST_ID}/raw`;

  let currentData  = null;
  let extendedMode = false;
  let currentWorker = null;

  const DNI_SHORT = {
    "Poniedziałek":"Pn","Wtorek":"Wt","Środa":"Śr",
    "Czwartek":"Czw","Piątek":"Pt","Sobota":"Sb","Niedziela":"Nd"
  };

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function formatDate(iso) {
    const [y,m,d] = iso.split('-');
    return `${d}.${m}`;
  }

  function getWeekLabel(isoDate) {
    const d = new Date(isoDate);
    const mon = new Date(d);
    mon.setDate(d.getDate() - ((d.getDay()+6)%7));
    const sun = new Date(mon); sun.setDate(mon.getDate()+6);
    const fmt = dt => `${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}`;
    return `Tydzień ${fmt(mon)} – ${fmt(sun)}.${sun.getFullYear()}`;
  }

  function getWeekKey(isoDate) {
    const d = new Date(isoDate);
    const mon = new Date(d);
    mon.setDate(d.getDate() - ((d.getDay()+6)%7));
    return mon.toISOString().slice(0,10);
  }

  // ── EKRAN WYBORU ──
  async function loadWorkerList() {
    const saved = localStorage.getItem('worker');
    try {
      const res = await fetch(`${BASE_URL}/lista.json?t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const lista = await res.json();

      // Pogrupuj wg sceny
      const grupy = {};
      lista.forEach(p => {
        const s = p.scena || "Pozostali";
        if (!grupy[s]) grupy[s] = [];
        grupy[s].push(p);
      });

      let html = '';
      for (const [scena, pracownicy] of Object.entries(grupy)) {
        html += `<div class="scena-label">${scena}</div>`;
        pracownicy.forEach(p => {
          html += `<button class="worker-btn" onclick="selectWorker('${p.nazwisko}','${p.plik}')">${p.nazwisko}</button>`;
        });
      }
      document.getElementById('workerList').innerHTML = html;

      // Jeśli był zapisany wybór – od razu wejdź
      if (saved) {
        const found = lista.find(p => p.nazwisko === saved);
        if (found) selectWorker(found.nazwisko, found.plik);
      }
    } catch(e) {
      document.getElementById('workerList').innerHTML =
        `<div class="status error">⚠ Błąd pobierania listy.<br><small>${e.message}</small></div>`;
    }
  }

  function selectWorker(nazwisko, plik) {
    currentWorker = { nazwisko, plik };
    localStorage.setItem('worker', nazwisko);
    document.getElementById('empName').textContent = nazwisko;
    document.getElementById('screenSelect').style.display = 'none';
    document.getElementById('screenPlan').style.display = 'flex';
    loadPlan(plik);
  }

  function goBack() {
    document.getElementById('screenPlan').style.display = 'none';
    document.getElementById('screenSelect').style.display = 'flex';
  }

  // ── EKRAN PLANU ──
  async function loadPlan(plik) {
    const content = document.getElementById('content');
    const btn     = document.getElementById('toggleBtn');
    content.innerHTML = `<div class="status"><div class="loader"></div>Pobieranie planu...</div>`;
    btn.classList.add('spinning');

    try {
      const res = await fetch(`${BASE_URL}/${plik}?t=${Date.now()}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      currentData = await res.json();
      render(currentData, extendedMode);
      const now = new Date();
      document.getElementById('lastUpdate').textContent =
        `odświeżono ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    } catch(e) {
      content.innerHTML = `<div class="status error">⚠ Błąd pobierania.<br><small>${e.message}</small></div>`;
    } finally {
      btn.classList.remove('spinning');
    }
  }

  function toggleMode() {
    if (!currentData) return;
    extendedMode = !extendedMode;
    document.getElementById('modeLabel').textContent = extendedMode ? 'INFO' : 'PLAN';
    render(currentData, extendedMode);
  }

  function render(shifts, extended) {
    const content = document.getElementById('content');
    const today   = todayStr();
    if (!shifts || shifts.length === 0) {
      content.innerHTML = `<div class="status error">⚠ Brak danych.</div>`;
      return;
    }
    let html = '', lastWeek = null, delay = 0;
    shifts.forEach(s => {
      const wk = getWeekKey(s.data);
      if (wk !== lastWeek) {
        lastWeek = wk;
        html += `<div class="week-label">${getWeekLabel(s.data)}</div>`;
      }
      const isToday = s.data === today;
      const isOff   = s.wolne;
      const rowCls  = `shift-row${isToday?' today':''}${isOff?' off':''}`;
      const badge   = isToday ? `<span class="today-badge">DZIŚ</span>` : '';
      const hoursHtml = isOff
        ? `<span class="col-hours off-text">WOLNE</span>`
        : `<span class="col-hours">${s.od}&thinsp;–&thinsp;${s.do}</span>`;
      const dateLabel = `${formatDate(s.data)} ${DNI_SHORT[s.dzien]||''}`;
      let subHtml = '';
      if (extended && (s.spektakl || s.proby)) {
        subHtml = `<div class="row-sub">
          <div class="col-spektakl">${s.spektakl||''}</div>
          <div class="col-proby">${s.proby||''}</div>
        </div>`;
      }
      html += `<div class="${rowCls}" style="animation-delay:${delay}ms">
        <div class="row-top">
          <div class="col-date">${dateLabel}</div>
          <div class="col-day">${s.dzien}${badge}</div>
          ${hoursHtml}
        </div>${subHtml}
      </div>`;
      delay += 40;
    });
    content.innerHTML = html;
  }

  // START
  loadWorkerList();
</script>
</body>
</html>
